name: validate
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Schema and integrity checks
        run: python3 scripts/validate.py
      - name: Generated files in sync with source
        run: |
          python3 scripts/build.py
          git diff --exit-code || {
            echo "::error::README/docs/exports are out of sync — run scripts/build.py and commit the result"; exit 1; }
