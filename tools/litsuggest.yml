notes: '[discovery 2026-08-18] Unique use case: Building your own trainable literature-triage
  model — a personal classifier for systematic monitoring/curation, not just a keyword
  alert; free from NIH Adoption: Published system (Allot et al., Nucleic Acids Research
  2021, W352–W358); still cited in recent curation workflows; no discontinuation notices
  found PubMed-only. Page is a single-page app, so features verified from the NAR
  paper and searches rather than the live UI; interface is dated.'
