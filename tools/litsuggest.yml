name: LitSuggest
category: staying-current
provider: NCBI / National Library of Medicine (NIH)
url: https://www.ncbi.nlm.nih.gov/research/litsuggest/
description: Train a personal machine-learning classifier by marking PubMed articles
  relevant or irrelevant; the system then scores new PubMed papers, sends an automated
  weekly digest per project, and supports shared collaborative curation.
access: free
domain: life-sciences
status: active
tier: core
