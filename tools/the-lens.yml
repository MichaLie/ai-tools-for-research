description: 'Links 155M+ patent records with 270M+ scholarly works: landscape dashboards,
  patent-to-paper citation mapping, PatSeq search for DNA/protein sequences inside
  patents, freedom-to-operate style filtering. Free personal accounts for academic
  researchers (exports up to 50,000 records); institutional toolkit for universities.'
