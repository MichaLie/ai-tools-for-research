notes: '[discovery 2026-08-18] Unique use case: Seeing which patents cite your own
  papers, and finding biological sequences buried in patents (PatSeq) — the scholarly-patent
  bridge no general assistant or single-corpus tool covers Adoption: Listed on WIPO
  Inspire; peer-reviewed review article in PMC; explicit cost-free academic personal
  accounts and Lens Equitable Access Program Ownership moved to non-profit The Lens
  Limited June 2026. Strength is authoritative linked data, not generative AI — release
  notes show few AI features; commercial individual use is $1,000/yr.'
