description: Open-source pipeline converting PDF, DOCX, PPTX, EPUB, and images to
  Markdown, JSON, or HTML with equations, tables, and reading order preserved — for
  building searchable or LLM-ready corpora from paper collections; runs locally.
access: free
domain: general
status: active
tier: core
