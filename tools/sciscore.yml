name: SciScore
category: ai-manuscript-review-disclosure
provider: SciCrunch, Inc.
url: https://sciscore.com/
description: Check a manuscript’s methods for reported blinding, randomization, power analysis,
  and research-resource identifiers (RRIDs), then review missing items against reporting guidelines.
  Paid author reports are available through Aseda Sciences; the score assesses reporting completeness.
access: paid
domain: life-sciences
status: active
tier: core
added: 2026-08
last_verified: '2026-10-15'
notes: '[discovery 2026-08-18] Unique use case: Automated rigor-and-reporting audit of your
  own methods section before submission — no other tool scores RRID identifiability and NIH
  rigor criteria Adoption: Integrated into FASEB journal submission workflow (Newswise/FASEB
  announcements); basis of the published Rigor and Transparency Index (iScience 2020, PMC7644557)
  Anita Bandrowski (RRID initiative) is CEO — credible lineage. Score reflects reporting completeness,
  not actual experimental quality.


  [sweep 2026-10-15] Restored the specific reporting checks that distinguish SciScore from
  general manuscript reviewers. The author route sells report credits; the old ten-free-reports
  claim was removed. Its score concerns reporting completeness, not proof of experimental
  quality. Sources: https://sciscore.com/; https://sciscore.asedasciences.com/; https://sciscore.asedasciences.com/pricing'
