notes: '[discovery 2026-08-18] Unique use case: The only public tool for checking
  whether a specific published paper is flagged for tortured phrases, mass-produced
  text, or reliance on retracted work — post-publication integrity screening for readers,
  not publishers Adoption: Peer-reviewed description (arXiv 2210.04895); coverage
  in The Conversation, Science, TechXplore; coverage credits it with contributing
  to 1000+ retractions Landing URL redirects to an Oracle APEX app (dbrech.irit.fr/pls/apex/f?p=9999)
  — data verified fresh, last update 2026-08-13. Academic side project, not a company.

  [sweep 2026-09-11] Landing redirect chain still works; APEX app alive, data last
  updated 2026-08-13. ''130M+ papers'' figure not shown on the page — dropped per
  anti-fabrication rule; added Seek & Blastn detector.'
