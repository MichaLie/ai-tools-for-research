name: Problematic Paper Screener
category: integrity-screening-forensics
provider: Guillaume Cabanac, IRIT / Universite de Toulouse (with Labbe & Magazinov)
url: https://www.irit.fr/~Guillaume.Cabanac/problematic-paper-screener
description: Browsable dashboard screening the literature with detectors for tortured
  phrases, SCIgen/Mathgen text, citejacking, Seek & Blastn nucleotide errors, problematic
  cell lines, and retracted or concerning references. Check a DOI before citing it,
  or trawl your field for flagged papers.
access: free
domain: general
status: active
tier: core
