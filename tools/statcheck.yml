name: statcheck
category: integrity-screening-forensics
provider: Michele Nuijten & Sacha Epskamp (Tilburg University)
url: https://statcheck.io/
description: Upload a PDF, DOCX, or HTML manuscript; it recomputes every APA-style
  statistical result (t, F, r, chi-square, Z, Q) and flags p-values inconsistent with
  the reported test statistic and degrees of freedom.
