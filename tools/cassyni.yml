notes: '[discovery 2026-08-18] Unique use case: publishing and discovering research
  talks as DOI-citable parts of the scholarly record Adoption: Imperial College London
  Graduate School runs a Cassyni seminar program for PhD students; partnerships with
  Frontiers, Springer Nature, Elsevier, Royal Society (2023-2025 press) Attending/browsing
  seminars free; hosting a series is institutional/publisher-paid. Landing page is
  minimal; capabilities verified via press and Imperial pages.'
